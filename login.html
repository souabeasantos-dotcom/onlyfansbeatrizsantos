<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif}
.card{background:#1e1e1e;padding:30px;border-radius:20px;width:90%;max-width:360px;text-align:center;border:1px solid #333}
.input-wrap{display:flex;align-items:center;background:#2a2a2a;border:1px solid #333;border-radius:12px;margin:15px 0;padding-left:15px}
.prefix{color:#fff;font-size:18px;font-weight:bold;margin-right:8px}
.input-wrap input{border:0;background:transparent;margin:0;padding:15px 15px 15px 0;flex:1;color:#fff;font-size:18px;outline:none}
button{width:100%;padding:15px;border-radius:12px;border:0;background:#ff1a75;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.msg{margin-top:15px;color:#ff4d4d;display:none}
</style>
</head>
<body>
<div class="card">
<h2 style="color:#fff;margin:0">🔒 Libere seu acesso</h2>
<p style="color:#888;font-size:14px">Digite seu número com DDD</p>

<div class="input-wrap">
  <span class="prefix">+55</span>
  <input id="phone" type="tel" placeholder="54991111952" maxlength="11">
</div>

<button onclick="liberar()">Liberar meu acesso VIP</button>
<div id="msg" class="msg"></div>
</div>
<script>
function getDeviceId(){
  let id = localStorage.getItem('device_id');
  if(!id){ id = 'dev-'+Math.random().toString(36).substr(2,9); localStorage.setItem('device_id', id); }
  return id;
}
async function liberar(){
  let num = document.getElementById('phone').value.replace(/\D/g,'');
  if(num.length < 11){ 
    document.getElementById('msg').style.display='block';
    document.getElementById('msg').innerText='Digite seu DDD + número completo (11 dígitos)';
    return;
  }
  let phone = '55' + num;
  const device = getDeviceId();
  const btn = document.querySelector('button'); btn.innerText='Verificando...';
  try{
    const res = await fetch(`/.netlify/functions/check-login?phone=${phone}&device=${device}`);
    const data = await res.json();
    if(data.ok){
      localStorage.setItem('vip_token', data.token);
      localStorage.setItem('vip_phone', phone);
      window.location.href = '/index.html';
    } else {
      document.getElementById('msg').style.display='block';
      document.getElementById('msg').innerText = data.msg || `Número ${phone} não encontrado`;
      btn.innerText='Liberar meu acesso VIP';
    }
  }catch(e){
    document.getElementById('msg').style.display='block';
    document.getElementById('msg').innerText='Erro de conexão';
    btn.innerText='Liberar meu acesso VIP';
  }
}
</script>
</body>
</html>
