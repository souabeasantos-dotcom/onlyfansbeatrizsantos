<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validar Acesso VIP</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#161616;border:1px solid #2a2a2a;border-radius:20px;padding:30px;width:92%;max-width:400px;text-align:center}
textarea{width:100%;background:#222;border:1px solid #333;border-radius:12px;color:#fff;padding:15px;margin:18px 0;min-height:110px;outline:none;font-size:11px;box-sizing:border-box}
.btn{width:100%;background:#ff2a6d;border:none;color:#fff;padding:16px;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
.msg{margin-top:15px;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="card">
<div style="font-size:32px">🔐</div>
<h2>Valide seu pagamento</h2>
<p style="color:#888;font-size:13px">Cole o código PIX copia e cola da compra pra liberar</p>
<textarea id="pixInput" placeholder="Cole aqui o código PIX que você pagou..."></textarea>
<button id="mainBtn" class="btn">📋 Selecionar Pix</button>
<div id="msg" class="msg"></div>
</div>
<script>
const SUPABASE_URL = "https://vaueneenwqyfftaoripx.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZhdWVuZWVud3F5ZmZ0YW9yaXB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Mjg0MjgsImV4cCI6MjEwMTEwNDQyOH0.DDZtEMrLMk-q5K6INudMyLNEtch-lhod_xqkQ6Jq1zg";
const input=document.getElementById('pixInput'), btn=document.getElementById('mainBtn'), msg=document.getElementById('msg');
let pronto=false;
function extrairID(t){let m=t.match(/\/cob\/([a-f0-9\-]+)/i);if(m)return m[1];let u=t.match(/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/i);if(u)return u[0];return t.slice(-60).trim();}
async function validar(){let id=extrairID(input.value);if(id.length<8){msg.innerHTML='<span style=color:#ff4d4d>Cole o código completo</span>';return;}btn.disabled=true;btn.textContent='Validando...';try{let r=await fetch(`${SUPABASE_URL}/rest/v1/pagamentos?pix_codigo=ilike.*${id}*`,{headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`}});let d=await r.json();if(d.length>0){msg.innerHTML='<span style=color:#2aff95>✅ Acesso liberado! Redirecionando...</span>';localStorage.setItem('vip_liberado','true');setTimeout(()=>location.href='/',1500);}else{msg.innerHTML='<span style=color:#ff4d4d>❌ Pix não encontrado. Verifique se é o código da compra.</span>';btn.disabled=false;btn.textContent='Validar meu acesso';}}catch(e){msg.textContent='Erro ao validar';btn.disabled=false;}}
async function selecionar(){try{let t=await navigator.clipboard.readText();if(t){input.value=t;pronto=true;btn.textContent='Validar meu acesso';msg.textContent='Código colado! Clique pra validar';return;}}catch(e){}input.focus();msg.textContent='Cole com Ctrl+V';}
btn.addEventListener('click',()=>{if(!pronto&&input.value.trim()==''){selecionar();}else{validar();}});
input.addEventListener('input',()=>{if(input.value.trim().length>10){pronto=true;btn.textContent='Validar meu acesso';}});
input.addEventListener('paste',()=>{setTimeout(()=>{pronto=true;btn.textContent='Validar meu acesso';},100);});
</script>
</body>
  </html>
