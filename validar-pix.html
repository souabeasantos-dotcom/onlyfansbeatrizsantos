<script>
const SUPABASE_URL = "https://vaueneenwqyfftaoripx.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZhdWVuZWVud3F5ZmZ0YW9yaXB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Mjg0MjgsImV4cCI6MjEwMTEwNDQyOH0.DDZtEMrLMk-q5K6INudMyLNEtch-lhod_xqkQ6Jq1zg";
const input=document.getElementById('pixInput'), btn=document.getElementById('mainBtn'), msg=document.getElementById('msg');
let pronto=false;
function extrairID(t){t=t.replace(/\s+/g,'');let m=t.match(/\/cob\/([a-f0-9\-]+)/i);if(m)return m[1];let u=t.match(/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/i);if(u)return u[0];return t.slice(-60);}
async function validar(){let id=extrairID(input.value);console.log('Buscando ID:',id);if(id.length<8){msg.innerHTML='<span style=color:#ff4d4d>Cole o código completo</span>';return;}btn.disabled=true;btn.textContent='Validando...';try{let url=`${SUPABASE_URL}/rest/v1/pagamentos?select=*&pix_codigo=ilike.*${id}*`;let r=await fetch(url,{headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`}});let d=await r.json();console.log(d);if(d.length>0){msg.innerHTML='<span style=color:#2aff95>✅ Acesso liberado! Redirecionando...</span>';localStorage.setItem('vip_liberado','true');setTimeout(()=>location.href='/',1500);}else{msg.innerHTML='<span style=color:#ff4d4d>❌ Pix não encontrado. ID buscado: '+id+'</span>';btn.disabled=false;btn.textContent='Validar meu acesso';}}catch(e){msg.textContent='Erro: '+e.message;btn.disabled=false;}}
async function selecionar(){try{let t=await navigator.clipboard.readText();if(t){input.value=t;pronto=true;btn.textContent='Validar meu acesso';msg.textContent='Código colado! Clique pra validar';return;}}catch(e){}input.focus();msg.textContent='Cole com Ctrl+V';}
btn.addEventListener('click',()=>{if(!pronto&&input.value.trim()==''){selecionar();}else{validar();}});
input.addEventListener('input',()=>{if(input.value.trim().length>10){pronto=true;btn.textContent='Validar meu acesso';}});
input.addEventListener('paste',()=>{setTimeout(()=>{pronto=true;btn.textContent='Validar meu acesso';},100);});
  </script>
