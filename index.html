let profile = INITIAL_DATA.profile;
let posts = INITIAL_DATA.posts;
let likedState = {};
let infoCollapsed=false;

function render(){
  const feed=document.getElementById('feed');
  feed.innerHTML = posts.map(p=>{
    const isLiked = !!likedState[p.id];
    const displayLikes = p.likes + (isLiked?1:0);
    return `
    <div class="border border-[#e5e7eb] rounded-xl overflow-hidden mb-4">
      <div class="flex gap-2 p-3 items-center">
        <img src="${profile.avatar}" class="w-8 h-8 rounded-full object-cover"/>
        <div><p class="text-[13px] font-semibold leading-none">${profile.name}</p><p class="text-[11px] text-[#8a8a8a]">@${profile.handle} • agora</p></div>
      </div>
      ${p.text?'<p class="px-3 pb-2 text-[14px] whitespace-pre-wrap">'+p.text+'</p>':''}
      <div class="bg-black">
        ${p.media.map(m=> m.type==='image' ? '<img src="'+m.dataUrl+'" style="'+(p.format!=='original'?'aspect-ratio:'+({ '9:16':'9/16','1:1':'1/1','4:3':'4/3','3:4':'3/4'}[p.format]||'auto')+';object-fit:cover;width:100%':'width:100%')+'" />' : '<video src="'+m.dataUrl+'" controls loop playsinline style="'+(p.format!=='original'?'aspect-ratio:'+({ '9:16':'9/16','1:1':'1/1','4:3':'4/3','3:4':'3/4'}[p.format]||'auto')+';object-fit:cover;width:100%':'width:100%')+'"></video>').join('')}
      </div>
      <div class="p-3 flex items-center gap-5">
        <button onclick="toggleLike('${p.id}')" class="flex items-center gap-1.5 group">
          <span class="text-[18px] transition-transform ${isLiked?'text-[#ff3040]':''}" style="${isLiked?'animation:heartPop .25s':''}">${isLiked?'❤':'♡'}</span>
          <span class="text-[13px] ${isLiked?'text-[#ff3040] font-semibold':'text-[#6b7280]'}">${displayLikes}</span>
        </button>
        <span class="text-[13px] text-[#6b7280]">Somente curtir • comentários desativados</span>
      </div>
    </div>`;
  }).join('') || '<p class="py-12 text-center text-[#8a8a8a] text-[14px]">Ainda sem posts</p>';

  const gal=document.getElementById('gallery');
  const allMedia = posts.flatMap(p=>p.media);
  gal.innerHTML = allMedia.map(m=> m.type==='image' ? '<img src="'+m.dataUrl+'" class="w-full aspect-square object-cover"/>' : '<video src="'+m.dataUrl+'" loop playsinline class="w-full aspect-square object-cover" muted></video>').join('') || '<p class="col-span-3 py-10 text-center text-[#8a8a8a]">Galeria vazia</p>';
  document.querySelectorAll('video').forEach(v=>{ v.loop=true; });
}

function switchTab(t){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    const is=b.dataset.tab===t;
    b.classList.toggle('border-[#1a1a1a]', is && t!=='gallery');
    b.classList.toggle('border-transparent', !is);
    b.classList.toggle('text-[#8a8a8a]', !is);
  });
  document.getElementById('feed').classList.toggle('hidden', t!=='posts');
  document.getElementById('nomedia').classList.toggle('hidden', t!=='nomedia');
  document.getElementById('gallery').classList.toggle('hidden', t!=='gallery');
}

window.toggleLike=(id)=>{
  likedState[id]=!likedState[id];
  render();
};

document.querySelectorAll('.tab-btn').forEach(b=> b.addEventListener('click', ()=> switchTab(b.dataset.tab)));
document.getElementById('toggleInfo').addEventListener('click', function(){
  infoCollapsed=!infoCollapsed;
  document.getElementById('collapsible').style.display = infoCollapsed ? 'none':'block';
  this.textContent = infoCollapsed ? 'Mostrar informações' : 'Recolher informações';
});

  render(); switchTab('posts');

                        <!-- SCRIPT NOVO - GAVETA / ETIQUETA - FINAL TRAVADO -->
  <script type="module">
  (async () => {
    const gate = document.getElementById('gate');
    const vipContent = document.getElementById('vipContent');
    try {
      const params = new URLSearchParams(location.search);
      let uid = params.get('uid') || localStorage.getItem('vip_uid_last');
      
      // SEM UID = BLOQUEIA
      if (!uid) {
        gate.innerHTML = '⛔ Acesso não liberado. Link inválido.';
        gate.style.display = 'flex';
        return;
      }
      
      localStorage.setItem('vip_uid_last', uid);

      const chave = 'etiqueta_' + uid;
      let etiqueta = localStorage.getItem(chave);
      if (!etiqueta) {
        etiqueta = crypto.randomUUID();
        localStorage.setItem(chave, etiqueta);
      }

      const r = await fetch(`/.netlify/functions/check-vip?uid=${encodeURIComponent(uid)}&etiqueta=${encodeURIComponent(etiqueta)}`);
      const data = await r.json();

      if (data.paid && !data.blocked) {
        gate.style.display = 'none';
        vipContent.style.display = 'block';
      } else if (data.blocked) {
        gate.innerHTML = '⛔ Este link já está vinculado a outro aparelho.';
        gate.style.display = 'flex';
      } else {
        gate.innerHTML = '⛔ Acesso não liberado.';
        gate.style.display = 'flex';
      }
    } catch (err) {
      console.error('ERRO GATE:', err);
      gate.innerHTML = '⛔ Erro ao verificar acesso.';
      gate.style.display = 'flex';
    }
  })();
  </script>
