<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Beatriz Santos</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>#gate{position:fixed;inset:0;z-index:9999;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}</style>
</head>
<body>
<div id="gate">Verificando acesso VIP...</div>
<div id="vipContent" style="display:none">
<!-- AQUI COMEÇA SEU SITE ORIGINAL -->
<div style="max-width:680px;margin:0 auto;padding:20px">
<h1 style="color:#ff007f;text-align:center">🔥 VIP Liberado 🔥</h1>
<p style="text-align:center">Cole aqui seu conteúdo original depois</p>
</div>
<!-- AQUI TERMINA -->
</div>
<script>
(async()=>{
const uid=new URLSearchParams(location.search).get('uid');
const gate=document.getElementById('gate');
const vip=document.getElementById('vipContent');
if(!uid){gate.innerHTML='❌ Acesso restrito<br><a href="https://t.me/Testessss_bot" style="color:#ff007f">Voltar pro Bot</a>';return}
try{
const r=await fetch('/.netlify/functions/check-vip?uid='+uid);
const d=await r.json();
if(d.paid){gate.style.display='none';vip.style.display='block'}else{gate.innerHTML='❌ Link inválido'}
}catch(e){gate.innerHTML='❌ Erro ao verificar'}
})();
</script>
</body>
</html>
