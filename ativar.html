<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ativar Acesso</title>
<style>body{background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif} .card{background:#1e1e1e;padding:30px;border-radius:20px;width:90%;max-width:360px;text-align:center;border:1px solid #333} input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#2a2a2a;color:#fff;margin:12px 0;box-sizing:border-box} button{width:100%;padding:15px;border-radius:12px;border:0;background:#ff1a75;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}</style>
</head>
<body>
<div class="card">
<h2 style="color:#fff">✅ Pagamento Aprovado!</h2>
<input id="nome" placeholder="Seu nome">
<input id="phone" type="tel" placeholder="WhatsApp com DDD">
<button onclick="liberar()">Liberar meu acesso VIP</button>
</div>
<script>
function liberar(){
  let nome = document.getElementById('nome').value.trim();
  let num = document.getElementById('phone').value.replace(/\D/g,'');
  if(!nome || num.length < 10){ alert('Preencha nome e número'); return; }
  if(num.length == 11) num = '55'+num;
  localStorage.setItem('vip_phone', num);
  localStorage.setItem('vip_token', 'TOKEN-'+num);
  localStorage.setItem('beatriz_vip_phone', num);
  window.location.href = '/index.html?phone='+num;
}
</script>
</body>
</html>
