<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativar Acesso VIP - Beatriz</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:Inter, sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;padding:28px;border-radius:16px;max-width:380px;width:100%;text-align:center}
h2{margin:0 0 8px;font-size:20px}
p{color:#aaa;font-size:14px;margin:0 0 20px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin-bottom:12px;box-sizing:border-box;font-size:16px}
button{width:100%;padding:14px;border-radius:10px;border:0;background:#ff0050;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:0.5}
.small{font-size:11px;color:#666;margin-top:12px}
.error{background:#2a1010;border:1px solid #ff0050;padding:12px;border-radius:10px;margin-bottom:12px;display:none;font-size:13px}
</style>
</head>
<body>
<div class="card" id="card">
<h2>✅ Pagamento Aprovado!</h2>
<p>Quase lá! Confirma seus dados pra liberar seu acesso VIP exclusivo da Beatriz.</p>
<div id="error" class="error"></div>
<input type="text" id="nome" placeholder="Seu nome" />
<input type="tel" id="telefone" placeholder="Seu WhatsApp com DDD (ex: 54999999999)" />
<button id="btn" onclick="ativar()">🔓 Liberar meu Acesso VIP</button>
<div class="small">Seu acesso é liberado na hora. Conteúdo 100% exclusivo.</div>
</div>

<script>
// ===== CONFIGURA AQUI =====
const SUPABASE_URL = "SUA_SUPABASE_URL_AQUI";
const SUPABASE_ANON_KEY = "SUA_SUPABASE_ANON_KEY_AQUI";
const TABELA = "assinantes"; // nome da sua tabela que libera o site perfilbeatrizsantos
// ==========================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const urlParams = new URLSearchParams(window.location.search);
const telegram_id = urlParams.get('id');

const card = document.getElementById('card');
const errorDiv = document.getElementById('error');

window.onload = () => {
  if(!telegram_id){
    card.innerHTML = `<h2>⛔ Acesso Negado</h2><p>Este link é exclusivo para quem fez o pagamento no Telegram. Volte no bot e clique em Acessar Conteúdo após pagar.</p>`;
  }
}

async function ativar(){
  const nome = document.getElementById('nome').value.trim();
  let telefone = document.getElementById('telefone').value.trim();
  const btn = document.getElementById('btn');

  if(!nome || !telefone){
    showError("Preencha nome e WhatsApp!");
    return;
  }
  
  telefone = telefone.replace(/\D/g,''); // só números

  if(telefone.length < 10){
    showError("Digite um WhatsApp válido com DDD");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Liberando...";

  try{
    // Salva ID + Telefone + Nome direto no banco que seu site VIP usa
    const { error } = await supabase
      .from(TABELA)
      .upsert({
        telegram_id: telegram_id,
        nome: nome,
        telefone: telefone,
        plano: 'VIP',
        status: 'ativo',
        created_at: new Date().toISOString()
      }, { onConflict: 'telegram_id' });

    if(error) throw error;

    // Salva também no localStorage pra já liberar
    localStorage.setItem('beatriz_vip_phone', telefone);
    localStorage.setItem('beatriz_vip_id', telegram_id);

    // Redireciona pro site VIP já logado
    window.location.href = `https://perfilbeatrizsantos.netlify.app/?phone=${telefone}`;

  }catch(e){
    console.error(e);
    showError("Erro ao liberar: " + e.message);
    btn.disabled = false;
    btn.innerText = "🔓 Liberar meu Acesso VIP";
  }
}

function showError(msg){
  errorDiv.style.display = 'block';
  errorDiv.innerText = msg;
}
</script>
</body>
</html>
