<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento Aprovado!</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ... seu CSS igual ... */
body{background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif}
.card{background:#1a1a1a;padding:30px;border-radius:20px;width:90%;max-width:400px;text-align:center;border:1px solid #333}
input{width:100%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #333;background:#000;color:#fff;box-sizing:border-box}
button{width:100%;padding:16px;background:#ff0055;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>✅ Pagamento Aprovado!</h2>
<p>Quase lá! Confirma seus dados pra liberar seu acesso VIP.</p>
<input id="nome" placeholder="Seu nome">
<input id="phone" placeholder="Seu WhatsApp com DDD">
<button id="btn" onclick="ativar()">🔓 Liberar meu Acesso VIP</button>
<p id="erro" style="color:red;display:none;margin-top:10px"></p>
</div>
<script>
const SUPABASE_URL = 'https://gqobweqqlscokbyzjenv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdxb2J3ZXFxbHNjb2tieXpqZW52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MjQyNjAsImV4cCI6MjA4ODEwMDI2MH0._1g3Y7X2vY2f3X3X3X3X3X3X3X3X3X3X3X3X3X3X3X';
const SITE_VIP = 'https://beasantosoficial.netlify.app';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function ativar(){
  const btn = document.getElementById('btn');
  const nome = document.getElementById('nome').value.trim();
  let phone = document.getElementById('phone').value.replace(/\D/g,'');
  const erro = document.getElementById('erro');

  if(nome.length < 2){ erro.textContent='Coloca seu nome'; erro.style.display='block'; return; }
  if(phone.length < 10){ erro.textContent='Coloca seu Whats com DDD'; erro.style.display='block'; return; }

  btn.textContent='Liberando...'; btn.disabled=true;
  try{
    const { error } = await supabaseClient.from('pagamentos').upsert({ phone: phone }, { onConflict: 'phone' });
    if(error) throw error;
    localStorage.setItem('vip_phone', phone);
    localStorage.setItem('vip_nome', nome);
    window.location.href = SITE_VIP + '/?vip=' + phone;
  }catch(e){
    erro.textContent='Erro: ' + e.message; erro.style.display='block';
    btn.textContent='🔓 Liberar meu Acesso VIP'; btn.disabled=false;
  }
}
</script>
</body>
</html>
