<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bea Santos VIP</title>
<script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;text-align:center}</style>
</head>
<body>
<div id="loading">🔓 Verificando seu acesso único...</div>
<div id="conteudo" style="display:none">
<h1>CONTEÚDO VIP LIBERADO 🔥</h1>
<p>Seus vídeos aqui</p>
</div>
<div id="bloqueado" style="display:none"><h1>⛔ Acesso Negado</h1><p id="msgBloqueio"></p></div>
<script>
(async()=>{
const p=new URLSearchParams(location.search);
const uid=p.get('uid'),t=p.get('t');
if(!uid||!t){loading.innerHTML='❌ Link inválido. Acesse pelo Telegram.';return;}
const fpLib=await FingerprintJS.load();
const fp=await fpLib.get();
const deviceId=fp.visitorId;
try{
const res=await fetch(`/.netlify/functions/validar?uid=${uid}&t=${t}&fp=${deviceId}`);
const data=await res.json();
if(data.ok){loading.style.display='none';conteudo.style.display='block';}
else{loading.style.display='none';bloqueado.style.display='block';msgBloqueio.innerText=data.msg;}
}catch(e){loading.innerText='Erro ao validar. Tente novamente.';}
})();
</script>
</body>
</html>
